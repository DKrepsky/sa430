name: Release-plz

# Computes the next version from conventional commits. On every push to main it:
#  - publishes to crates.io and pushes a tag for any version not yet released (the release PR was merged);
#  - opens or updates a release PR with the version bump and changelog, if the new commits warrant a release.
# The tag triggers release.yml (cargo-dist), which builds the binaries and creates the GitHub release.

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # A tag pushed with the default GITHUB_TOKEN does not trigger other workflows, so a PAT is used
          # to let release.yml (cargo-dist) run on the new tag.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Update Rust
        run: rustup update stable

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Run release-plz release
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Update Rust
        run: rustup update stable

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Run release-plz release-pr
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
