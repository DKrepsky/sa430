[package]
name = "sa430"
version = "0.1.1"
edition = "2021"
rust-version = "1.74"
authors = ["David Krepsky"]
description = "A library for the SA430 Sub 1GHz Spectrum Analyzer, from Texas Instruments"
keywords = ["sa430", "spectrum", "analyzer", "ti"]
categories = ["hardware-support", "command-line-utilities"]
license = "MIT"
repository = "https://github.com/DKrepsky/sa430"
readme = "README.md"

[features]
# Exposes `sa430::test_utils` (mock channel and canned device responses) for downstream tests.
test-utils = []

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
udev = "0.9.3"

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
serialport = "4.8.1"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.3"
# Enables the `test-utils` feature for this crate's own tests (including the CLI binary's unit tests).
sa430 = { path = ".", features = ["test-utils"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
